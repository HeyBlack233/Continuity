# Gradle daemon settings. The JVM itself is pinned to Temurin 26 by
# gradle/gradle-daemon-jvm.properties, so ./gradlew always runs on Java 26.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_version=0.1.0
mod_minecraft_version=1.16
maven_group=me.pepperbell
archives_base_name=continuity
