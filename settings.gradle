pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = uri('https://maven.fabricmc.net/')
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Auto-provisions the Java 26 toolchain when it is not installed locally.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Continuity'
