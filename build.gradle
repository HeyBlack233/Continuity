plugins {
	alias(libs.plugins.fabric.loom)
	id 'maven-publish'
}

def javaRelease = libs.versions.java.get().toInteger()
def archiveNameValue = providers.gradleProperty('archives_base_name').get()
def extraBuildMetadata = System.getenv('GITHUB_RUN_NUMBER') != null ? "-build.${System.getenv('GITHUB_RUN_NUMBER')}" : ''

version = providers.gradleProperty('mod_version').get() + '+' + providers.gradleProperty('mod_minecraft_version').get() + extraBuildMetadata
group = providers.gradleProperty('maven_group').get()

base {
	archivesName.set(archiveNameValue)
}

repositories {
	maven {
		name = 'Fabric'
		url = uri('https://maven.fabricmc.net/')
	}
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = uri('https://maven.terraformersmc.com')
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = uri('https://api.modrinth.com/maven')
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'Shedaniel'
		url = uri('https://maven.shedaniel.me')
	}
	maven {
		url = uri('https://server.bbkr.space/artifactory/libs-release')
	}
}

dependencies {
	// Versions are managed in gradle/libs.versions.toml.
	minecraft libs.minecraft
	mappings variantOf(libs.yarn) { classifier 'v2' }
	modImplementation libs.fabric.loader

	// Fabric API
	modImplementation libs.fabric.api

	modImplementation('com.terraformersmc:modmenu:1.16.23') {
		exclude group: 'net.fabricmc.fabric-api'
	}

	modCompileOnly 'maven.modrinth:sodium:mc1.16.5-0.2.0'
}

processResources {
	inputs.property 'version', version
	inputs.property 'loader_version', libs.versions.loader.get()
	inputs.property 'minecraft_version', libs.versions.minecraft.get()

	filteringCharset = 'UTF-8'

	filesMatching('fabric.mod.json') {
		expand version: version,
				loader_version: libs.versions.loader.get(),
				minecraft_version: libs.versions.minecraft.get()
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = javaRelease
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaRelease)
	}
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present. If you remove this line, sources will not be generated.
	withSourcesJar()
}

loom {
	runs {
		client {
			jvmArguments.addAll(
				'--sun-misc-unsafe-memory-access=allow',
				'--enable-native-access=ALL-UNNAMED',
				'--enable-final-field-mutation=ALL-UNNAMED'
			)
		}
		server {
			// Loom already adds the legacy "nogui" argument for dedicated servers.
			jvmArguments.addAll(
				'--sun-misc-unsafe-memory-access=allow',
				'--enable-native-access=ALL-UNNAMED',
				'--enable-final-field-mutation=ALL-UNNAMED'
			)
		}
	}
}

jar {
	from('LICENSE') {
		rename { "${it}_${archiveNameValue}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
